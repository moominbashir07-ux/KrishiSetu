version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci --omit=dev
run:
  command: node server.js
  network:
    port: 3000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: 3000
    - name: BEDROCK_REGION
      value: ap-south-1
    - name: STORAGE_PROVIDER
      value: s3
    - name: BEDROCK_PROVIDER
      value: aws
    - name: MARKET_DATA_PROVIDER
      value: datagov
# Note: Sensitive variables (DATABASE_URL, JWT_SECRET, ADMIN_BOOTSTRAP_KEY, DATA_GOV_IN_API_KEY)
# must be mapped via AWS App Runner console or AWS Secrets Manager / SSM Parameter Store.
